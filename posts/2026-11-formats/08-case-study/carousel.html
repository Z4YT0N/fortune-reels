html,body { width:5400px; height:1350px; }

.stat { position:absolute; left:0; width:1080px; text-align:center; }
.stat .big { font-size:190px; line-height:1; font-weight:700; color:var(--g); text-shadow:0 0 50px rgba(0,219,51,.45); }
.stat .lb { font-size:40px; color:var(--mute); margin-top:22px; }
.tag { position:absolute; font-size:30px; font-weight:600; color:var(--g); border:2px solid var(--g); border-radius:30px; padding:2px 24px 6px; white-space:nowrap; }
.cut { position:absolute; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
/* Plex: room under the baseline for pills/chips/labels */
.pill { line-height:1.28; padding-bottom:6px; }
.chip { padding-bottom:10px; font-weight:600; }
.lbl { padding-bottom:10px; font-weight:700; }
