<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
html,body { width:1080px; height:1350px; }
#hero { left:-30px; top:-40px; width:1140px; filter: saturate(.9) contrast(1.05); }
.shade { inset:0; background:
  linear-gradient(180deg, rgba(18,20,22,.78) 0, rgba(18,20,22,.35) 26%, rgba(18,20,22,0) 42%, rgba(18,20,22,0) 66%, rgba(18,20,22,.7) 80%, #121416 92%); }
.mast { font-size:236px; line-height:1; font-weight:700; letter-spacing:0; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.45); }
.strip { position:absolute; left:84px; right:84px; height:56px; display:flex; justify-content:space-between; align-items:center; font-size:30px; font-weight:600; line-height:1; color:#fff; border-top:2px solid rgba(255,255,255,.55); border-bottom:2px solid rgba(255,255,255,.55); }
.strip .g { color:var(--g); }
.hd { position:absolute; right:84px; text-align:right; white-space:nowrap; line-height:1.05; font-weight:700; }
.gl { color:var(--g); text-shadow:0 0 30px rgba(0,219,51,.6), 0 0 90px rgba(0,219,51,.35); }
.cl { position:absolute; text-align:right; white-space:nowrap; line-height:1.3; text-shadow:0 2px 14px rgba(0,0,0,.6); }
.cl { width:430px; }
.cl .a, .cl .b, .cl .src { display:table; margin-left:auto; }
.cl .a { font-size:46px; font-weight:700; color:#fff; }
.cl .b { font-size:34px; color:#d9dadb; }
.cl .src { font-size:20px; font-weight:400; color:#9a9da0; margin-top:6px; }
.bar { display:block; margin-left:auto; width:56px; height:6px; background:var(--g); border-radius:3px; margin-bottom:12px; box-shadow:0 0 12px rgba(0,219,51,.7); }
.stk { position:absolute; width:250px; height:250px; border-radius:50%; font-weight:700; background:var(--g); color:#121416; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transform:rotate(-10deg); box-shadow:0 0 50px rgba(0,219,51,.5), 0 20px 40px rgba(0,0,0,.5); line-height:1.05; }
</style></head>
<body>
<img id="hero" class="abs" src="gen/dune.png">
<div class="abs shade"></div>
<div class="frame" style="left:40px; top:40px; width:1000px; height:1140px; z-index:40"></div>
<img class="logo" src="assets/logo-en-h-primary-white.svg" style="left:50%; top:66px; height:36px; transform:translateX(-50%); z-index:40">

<div class="strip" style="top:112px"><span>العدد <span class="g">٠١</span></span><span>نوفمبر ٢٠٢٦</span></div>
<div class="t mast" style="top:196px">فورتشن كود</div>

<!-- cover story -->
<div class="hd" style="top:428px; font-size:60px">الموقع البطيء</div>
<div class="hd gl" style="top:494px; font-size:124px">يندفن.</div>

<!-- sky cover lines (systems, AI) -->
<div class="cl" style="left:84px; top:430px">
  <div class="bar"></div>
  <div class="a">الإكسل ولا نظام؟</div>
  <div class="b">متى يصير عبء عليك</div>
</div>
<div class="cl" style="left:84px; top:578px">
  <div class="bar"></div>
  <div class="a">موظف <span class="g">ذكاء اصطناعي</span></div>
  <div class="b">يرد على عملائك وأنت نايم</div>
</div>

<!-- sticker CTA -->
<div class="stk" style="left:776px; top:690px"><div style="font-size:30px; font-weight:600; line-height:1.2; margin-bottom:-6px">اكتب</div><div style="font-size:60px; line-height:1.3">انطباع</div><div style="font-size:25px; font-weight:600; line-height:1.3; margin-top:14px">ونقيّم موقعك<br>مجانًا</div></div>

<!-- bottom cover lines (speed) -->
<div class="cl" style="right:84px; top:990px">
  <div class="bar"></div>
  <div class="a"><span class="g">٥٣٪</span> يطلعون</div>
  <div class="b">لو موقعك تأخر ٣ ثواني</div>
  <div class="src">المصدر: <bdi>Google</bdi></div>
</div>
<div class="cl" style="left:84px; top:990px">
  <div class="bar"></div>
  <div class="a"><span class="g">٣٤ ميجا</span> صارت ١٤٠ كيلو</div>
  <div class="b">نفس الصور، ونفس الجودة</div>
</div>

<script src="footer.js"></script>
<script>
foot(66, 1208, 948);
document.fonts.ready.then(() => { fitLines('.mast', 912); fitLines('.cl .a', 430); fitLines('.cl .b', 430); fitLines('.hd', 470); document.body.dataset.ready = 1; });
</script>
</body></html>
