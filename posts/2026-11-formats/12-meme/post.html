<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
html,body { width:1080px; height:1350px; }
.xc { position:absolute; left:80px; top:150px; width:920px; height:270px; border-radius:26px; background:#1b1e21; border:1.5px solid rgba(255,255,255,.12); padding:28px 34px; }
.xc .who { display:flex; align-items:center; gap:16px; }
.xc .av { width:64px; height:64px; border-radius:50%; background:#121416; border:2px solid var(--g); display:flex; align-items:center; justify-content:center; }
.xc .av img { width:36px; }
.xc .nm { font-size:32px; font-weight:700; line-height:1.2; }
.xc .hd { font-family:Plex; font-weight:400; font-size:20px; color:var(--mute); direction:ltr; }
.xc .tick { width:24px; height:24px; }
.xc .tx { position:absolute; right:34px; top:118px; font-size:50px; font-weight:600; line-height:1.3; white-space:nowrap; }
.ph { position:absolute; left:80px; top:446px; width:920px; height:640px; border-radius:26px; overflow:hidden; border:1.5px solid rgba(255,255,255,.14); }
.ph img { position:absolute; left:0; top:-250px; width:920px; }
.ph .tint { position:absolute; inset:0; background:
   radial-gradient(60% 50% at 70% 30%, rgba(0,219,51,.18), transparent 70%),
   linear-gradient(180deg, rgba(18,20,22,0) 60%, rgba(18,20,22,.85) 100%); mix-blend-mode:normal; }
.chip { position:absolute; background:rgba(18,20,22,.86); border:2px solid rgba(255,255,255,.25); border-radius:16px; padding:8px 22px 10px; white-space:nowrap; box-shadow:0 14px 30px rgba(0,0,0,.55); }
.chip .a { font-size:30px; font-weight:700; line-height:1.3; }
.chip .b { font-size:24px; font-weight:400; color:var(--mute); line-height:1.3; }
.dotg { display:inline-block; width:14px; height:14px; border-radius:50%; background:#6b7075; margin-left:10px; vertical-align:middle; }
</style></head>
<body>
<div class="glow" style="left:300px; top:380px; width:900px; height:800px; opacity:.45"></div>

    <div><div class="nm">فورتشن كود <svg class="tick" viewBox="0 0 24 24" style="vertical-align:-3px"><circle cx="12" cy="12" r="11" fill="#00DB33"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#121416" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="hd">@fortunecodeorg</div></div></div>
  <div class="tx">المطوّر: «بكرة أسلّمك الموقع، <span class="g">وعد</span>»<br>صاحب الشركة بعد <span class="g">٤ شهور</span>:</div>
</div>

<div class="ph"><img src="gen/owner_wait.png"><div class="tint"></div>

</div>
