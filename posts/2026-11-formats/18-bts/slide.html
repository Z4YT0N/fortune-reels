<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
html,body { width:1080px; height:1350px; }
body { background: radial-gradient(ellipse 60% 45% at 50% 45%, rgba(0,219,51,.13), rgba(18,20,22,0) 70%), #121416; }
.card { position:absolute; left:110px; top:160px; width:860px; height:840px; border-radius:18px; overflow:hidden; background:#0b0c0d center/cover no-repeat;
  box-shadow: 0 40px 80px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.14); z-index:10; }
.card .grade { position:absolute; inset:0; background: linear-gradient(180deg, rgba(18,20,22,.0) 55%, rgba(18,20,22,.75) 100%); mix-blend-mode:normal; }
.tape { position:absolute; width:190px; height:54px; background:rgba(0,219,51,.62); z-index:20; box-shadow:0 0 24px rgba(0,219,51,.35);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6px, #000 calc(100% - 6px), transparent 100%); }
.num { position:absolute; left:84px; top:76px; font-size:36px; font-weight:600; color:var(--mute); z-index:30; }
.num b { color:var(--g); font-weight:inherit; }
.cap { font-size:62px; z-index:30; }
.sub { font-size:40px; font-weight:600; z-index:30; }
.kw { background:var(--g); color:var(--bg); border-radius:12px; padding:0 18px; }
.code { position:absolute; left:0; top:0; width:1280px; height:800px; background:#0f1113; transform-origin:0 0; font-family:Plex, monospace; direction:ltr; overflow:hidden; }
.code i { position:absolute; height:22px; border-radius:11px; }
</style></head>
<body>
<div class="frame" style="left:40px; top:40px; width:1000px; height:1140px; z-index:40"></div>
<img class="logo" src="assets/logo-en-h-primary-white.svg" style="left:50%; top:82px; transform:translateX(-50%); z-index:40">
<div id="root"></div>
<script src="footer.js"></script>
<script>
const s = +(new URLSearchParams(location.search).get('s') || 1);
const R = document.getElementById('root');
const add = h => R.insertAdjacentHTML('beforeend', h);
const SL = [null,
  { img:'gen/devs.png', pos:'50% 58%', rot:-2, cap:'ورا كل موقع… <span class="g">فريق.</span>', sub:'من كواليس فورتشن كود' },
  { img:'gen/board.png', pos:'50% 45%', rot:2, cap:'نرسمه على <span class="g">اللوح</span>', sub:'قبل ما نكتب سطر كود واحد.' },
  { img:'gen/p4_keyboard.png', pos:'50% 62%', rot:-1.5, cap:'نختبر كل <span class="g">زر</span>', sub:'قبل ما يوصلك أي شي.' },
  { img:'gen/p3_laptop_side.png', pos:'', rot:1.5, cap:'وبعدها يطلع <span class="g">موقعك.</span>', sub:'اكتب <span class="kw">انطباع</span> ونقيّم موقعك مجانًا.' }][s];
add(`<div class="num"><b>${['','٠١','٠٢','٠٣','٠٤'][s]}</b> / ٠٤</div>`);
add(`<div class="card" id="card" style="transform:rotate(${SL.rot}deg); ${SL.pos ? `background-image:url(${SL.img}); background-position:${SL.pos};` : ''} ${s < 3 ? 'filter:brightness(.82) contrast(1.12) saturate(.85);' : ''}"><div class="grade"></div></div>`);
const card = document.getElementById('card');
if (s === 4) { // laptop photo with a code editor composited on its screen
  const W = 1000, k = W/896, ox = -60, oy = -300;
  card.insertAdjacentHTML('afterbegin', `<img src="${SL.img}" style="position:absolute; left:${ox}px; top:${oy}px; width:${W}px">`);
  const Q = [[87,567],[538,540],[586,868],[134,946]].map(([x,y]) => [x*k+ox, y*k+oy]);
  const c = document.createElement('div'); c.className = 'code';
  const col = ['#00DB33','#7ad7ff','#c9a7ff','#bbbdbf','#ffd27a','#5a6168'];
  let h = '<div style="position:absolute; left:0; top:0; right:0; height:46px; background:#1a1d20"></div>';
  for (let r = 0; r < 26; r++) { let x = 60 + (r % 5 === 0 ? 0 : (r % 3) * 50);
    for (let t = 0; t < 1 + (r * 7 % 4); t++) { const w = 60 + ((r * 37 + t * 53) % 220); h += `<i style="left:${x}px; top:${74 + r * 27}px; width:${w}px; height:14px; background:${col[(r + t * 2) % 6]}; opacity:.85"></i>`; x += w + 18; } }
  c.innerHTML = h; c.style.transform = quadTransform(1280, 800, Q); c.style.zIndex = 1; card.insertBefore(c, card.querySelector('.grade'));
  // soft screen glow
  card.insertAdjacentHTML('beforeend', `<div style="position:absolute; left:${Q[0][0]}px; top:${Q[1][1]}px; width:${Q[2][0]-Q[0][0]}px; height:${Q[3][1]-Q[1][1]}px; background:radial-gradient(closest-side, rgba(0,219,51,.18), rgba(0,219,51,0)); filter:blur(30px)"></div>`);
}
// tape on two corners
add(`<div class="tape" style="left:${s%2 ? 70 : 800}px; top:138px; transform:rotate(${s%2 ? -28 : 26}deg)"></div>`);
add(`<div class="tape" style="left:${s%2 ? 820 : 80}px; top:930px; transform:rotate(${s%2 ? -24 : 30}deg)"></div>`);
add(`<div class="t cap" style="top:1026px">${SL.cap}</div>`);
if (SL.sub) add(`<div class="t sub ${s === 4 ? '' : 'mute'}" style="top:1104px">${SL.sub}</div>`);
foot(66, 1208, 948);
document.fonts.ready.then(() => { fitLines('.t', 900); document.body.dataset.ready = 1; });
</script>
</body></html>
