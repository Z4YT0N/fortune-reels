<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
html,body { width:1080px; height:1350px; }
.xcard { position:absolute; left:110px; top:250px; width:860px; background:#0b0c0d; border:2px solid rgba(255,255,255,.16); border-radius:34px; padding:38px 52px 26px; box-shadow:0 0 0 1px rgba(0,219,51,.25), 0 30px 80px rgba(0,0,0,.7), 0 0 90px rgba(0,219,51,.18); z-index:10; }
.who { display:flex; align-items:center; gap:22px; }
.av { width:96px; height:96px; border-radius:50%; background:#121416; border:2px solid rgba(0,219,51,.6); display:flex; align-items:center; justify-content:center; box-shadow:0 0 30px rgba(0,219,51,.35); }
.av img { width:56px; }
.nm { font-size:44px; line-height:1.2; font-weight:700; }
.hd { font-family:Plex; font-weight:400; font-size:26px; color:#71767b; direction:ltr; text-align:right; }
.dots { margin-right:auto; display:flex; gap:7px; }
.dots i { width:9px; height:9px; border-radius:50%; background:#71767b; display:block; }
.body { margin-top:30px; font-size:54px; line-height:1.42; font-weight:600; }
.body p { margin:0; white-space:nowrap; width:max-content; }
.meta { margin-top:20px; font-size:30px; font-weight:400; color:#71767b; }
.src2 { margin-top:6px; font-size:21px; font-weight:400; white-space:nowrap; color:#71767b; }
.src { margin-top:8px; font-size:22px; color:#71767b; font-family:Plex; direction:ltr; text-align:right; }
.bar { margin-top:18px; padding-top:18px; border-top:1px solid rgba(255,255,255,.12); display:flex; justify-content:space-between; direction:ltr; padding-left:10px; padding-right:10px; }
.bar svg { width:38px; height:38px; fill:none; stroke:#71767b; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.hl { font-weight:700; color:var(--g); text-shadow:0 0 26px rgba(0,219,51,.35); }
.pill { display:inline-block; background:var(--g); color:var(--bg); border-radius:14px; padding:0 22px 6px; line-height:1.3; }
</style></head>
<body>
<div class="glow" style="left:-160px; top:120px; width:1400px; height:1000px; opacity:1"></div>
<div class="glow" style="left:240px; top:-200px; width:600px; height:600px; opacity:.7"></div>
<div class="frame" style="left:40px; top:40px; width:1000px; height:1140px"></div>
<img class="logo" src="assets/logo-en-h-primary-white.svg" style="left:50%; top:82px; transform:translateX(-50%)">
<div class="t mute" style="top:158px; font-size:40px">رأي المؤسس، بدون تجميل:</div>

<div class="xcard">
  <div class="who">
    <div class="av"><img src="assets/icon-green.svg"></div>
    <div><div class="nm">فورتشن كود</div><div class="hd">@fortunecodeorg</div></div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <div class="body">
    <p>موقعك البطيء</p>
    <p>ما يخسّرك <span class="hl">زوار</span> بس…</p>
    <p>يخسّرك <span class="hl">عملاء</span> جاهزين يدفعون.</p>
    <p style="margin-top:26px"><span class="hl"><bdi>٥٣٪</bdi></span> من زوار الجوال يطلعون</p>
    <p>لو الصفحة تأخرت فوق <span class="hl">٣ ثواني</span>.</p>
  </div>
  <div class="meta">٩:٤١ م  |  ٧ نوفمبر ٢٠٢٦</div>
  <div class="src2">المصدر: <bdi>Google / DoubleClick</bdi>، دراسة <bdi>The Need for Mobile Speed (2016)</bdi></div>
  <div class="bar">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 20.5l1.6-4.6A8.4 8.4 0 1 1 21 11.5Z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M4 9l3-3 3 3M7 6v9a3 3 0 0 0 3 3h5M20 15l-3 3-3-3M17 18V9a3 3 0 0 0-3-3H9"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21Z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></svg>
  </div>
</div>

<div class="t" id="cta" style="top:1084px; font-size:44px; z-index:20">اكتب <span class="pill">انطباع</span> ونراجع موقعك مجانًا</div>

<script src="footer.js"></script>
<script>
foot(66, 1208, 948);
document.fonts.ready.then(() => {
  fitLines('.t', 900); fitLines('.body p', 756);
  // keep the card vertically centred between the kicker and the CTA
  const c = document.querySelector('.xcard'), h = c.getBoundingClientRect().height;
  c.style.top = Math.round(232 + (1062 - 232 - h) / 2) + 'px'; console.log('cardH', h);
  document.body.dataset.ready = 1;
});
</script>
</body></html>
