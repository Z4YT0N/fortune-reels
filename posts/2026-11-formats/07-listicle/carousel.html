.chip { position:absolute; background:#1b1e21; border:2px solid rgba(255,255,255,.3); border-radius:14px; padding:4px 20px 0; font-size:38px; white-space:nowrap; box-shadow:0 14px 30px rgba(0,0,0,.55); }
.src { position:absolute; font-family:Plex; direction:ltr; font-size:19px; color:#8d9195; white-space:nowrap; }
.pill { display:inline-block; background:var(--g); color:var(--bg); border-radius:16px; padding:0 22px; }
.lat { font-family:Plex; direction:ltr; unicode-bidi:isolate; }
.cut { position:absolute; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
/* Plex: room under the baseline for pills/chips/labels */
.pill { line-height:1.28; padding-bottom:6px; }
.chip { padding-bottom:10px; font-weight:600; }
.lbl { padding-bottom:10px; font-weight:700; }
