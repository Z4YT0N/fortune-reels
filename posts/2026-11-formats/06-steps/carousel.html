<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
html,body { width:6480px; height:1350px; }
.dev { position:absolute; -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }
.num { position:absolute; font-size:250px; line-height:1; font-weight:700; color:var(--g); text-shadow:0 0 60px rgba(0,219,51,.55), 0 0 140px rgba(0,219,51,.3); }
.stp { position:absolute; font-size:36px; color:var(--mute); white-space:nowrap; }
.chip { position:absolute; background:#1b1e21; border:2px solid rgba(255,255,255,.3); border-radius:14px; padding:4px 20px 0; font-size:36px; white-space:nowrap; box-shadow:0 14px 30px rgba(0,0,0,.55); }
.lat { font-family:Plex; direction:ltr; unicode-bidi:isolate; }
.prog { position:absolute; height:12px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; }
.prog i { position:absolute; right:0; top:0; bottom:0; background:var(--g); box-shadow:0 0 18px var(--g); border-radius:6px; }
.pill { display:inline-block; background:var(--g); color:var(--bg); border-radius:16px; padding:0 22px; }
/* mock UI */
.ui { font-family:Plex; direction:ltr; color:#202124; }
/* Plex: room under the baseline for pills/chips/labels */
.pill { line-height:1.28; padding-bottom:6px; }
.chip { padding-bottom:10px; font-weight:600; }
.lbl { padding-bottom:10px; font-weight:700; }
</style></head>
<body>
<div id="stage"></div>
<svg class="marks" width="6480" height="1350" style="z-index:40"></svg>
<script src="footer.js"></script><script src="gallery.js"></script>
<script>document.querySelector('svg.marks').innerHTML = '<defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs><g id="mk"></g>';</script>
<script>const PAGE_W = 6480;</script>
<script src="kit.js"></script>
<script>
const LAP_Q = [[178,473],[718,473],[723,812],[172,812]], PHONE_Q = [[341,358],[555,358],[555,826],[341,826]], SIDE_Q = [[87,567],[538,540],[586,868],[134,946]];
for (let i = 1; i <= 6; i++) brand(i);
// progress bar on step slides (2-5): fills right→left
for (let i = 2; i <= 5; i++) {
  el(`<div class="prog" style="left:${S(i, 330)}px; top:1124px; width:420px"><i style="width:${(i - 1) * 25}%"></i></div>`, 35);
  el(`<div class="stp lat" style="left:${S(i, 770)}px; top:1104px; font-size:30px; color:#8d9195">${i - 1}/4</div>`, 35);
}
glow(S(1, 540), 820, 540); glow(S(2, 540), 830, 470, .85); glow(S(3, 560), 840, 470, .85); glow(S(4, 520), 860, 480, .85); glow(S(5, 560), 860, 470, .85); glow(S(6, 540), 700, 520, .8);

/* ============ 1 — cover ============ */
ct(1, 156, 'كيف تعرف إن موقعك', 84);
ct(1, 252, '<span class="g">بطيء</span>؟', 150, 'line-height:1.05; text-shadow:0 0 40px rgba(0,219,51,.35)');
el(`<div class="abs" style="left:${S(1, 0)}px; top:420px; width:1080px; text-align:center; font-size:56px; line-height:1.1">في <span class="num" style="position:relative; font-size:200px; vertical-align:-40px">٤</span> خطوات</div>`, 30);
ct(1, 650, 'بدون مبرمج، ومن جهازك.', 44, '', 'mute');
{ const Q = device('gen/p2_phone.png', 896, PHONE_Q, S(1, 190), 500, 700, 5);
  const ui = screen(430, 940, `
    <div class="abs" style="left:0; right:0; top:0; height:70px; background:#fff; border-bottom:1px solid #e3e5e8"></div>
    <div class="abs" style="left:30px; top:24px; width:120px; height:22px; border-radius:6px; background:#121416"></div>
    <div class="abs" style="left:0; top:70px; height:8px; width:22%; background:var(--g)"></div>
    <div class="abs" style="left:150px; top:300px; width:130px; height:130px; border-radius:50%; border:14px solid #d6d9dc; border-top-color:#121416"></div>
    ${[0,1,2].map(k => `<div class="abs" style="left:40px; top:${520 + k * 120}px; width:350px; height:90px; border-radius:12px; background:#e7e9eb"></div>`).join('')}`, '#F4F5F6');
  ui.style.borderRadius = '44px'; onScreen(ui, 430, 940, Q);
}
el(`<div class="chip" style="left:${S(1, 690)}px; top:830px; transform:rotate(4deg)">يحمّل…</div>`, 31);
el(`<div class="chip" style="left:${S(1, 120)}px; top:960px; transform:rotate(-5deg)">لسّا يحمّل…</div>`, 31);
el(`<div class="t mute" style="left:auto; right:${PAGE_W - S(1, 1000)}px; transform:none; top:1092px; font-size:38px">احفظه واسحب</div>`, 30);
P(`M${S(1, 760)},1156 C ${S(1, 860)},1170 ${S(1, 960)},1150 ${S(2, 40)},1110`); arrowHead(S(2, 44), 1106, -25);

/* step slide header */
function stepHead(i, n, title, sub) {
  el(`<div class="num" style="left:auto; right:${PAGE_W - S(i, 985)}px; top:150px">${n}</div>`, 30);
  rt(i, 250, 160, `<span class="mute" style="font-size:34px; font-weight:500">الخطوة ${n}</span>`, 34);
  rt(i, 250, 210, title, 66, '', 'fit');
  rt(i, 250, 296, sub, 40, 'line-height:1.3', 'mute fit');
}

/* ============ 2 — open PageSpeed ============ */
stepHead(2, '١', 'افتح <bdi class="lat g" style="font-size:54px">PageSpeed Insights</bdi>', 'ادخل <bdi class="lat" style="color:#fff; font-size:34px">pagespeed.web.dev</bdi><br>وحط رابط موقعك.');
{ const Q = device('gen/p1_laptop.png', 896, LAP_Q, S(2, 70), 330, 940, 5);
  const ui = screen(1280, 796, `<div class="ui">
    <div class="abs" style="left:0; right:0; top:0; height:56px; background:#f1f3f4; border-bottom:1px solid #dadce0"></div>
    <div class="abs" style="left:150px; top:12px; width:700px; height:32px; border-radius:16px; background:#fff; font-size:18px; line-height:32px; padding-left:20px; color:#5f6368">pagespeed.web.dev</div>
    ${[0,1,2].map(k => `<div class="abs" style="left:${24 + k * 30}px; top:21px; width:14px; height:14px; border-radius:50%; background:#c4c7c5"></div>`).join('')}
    <div class="abs" style="left:0; right:0; top:200px; text-align:center; font-size:58px; font-weight:500; color:#202124">PageSpeed Insights</div>
    <div class="abs" style="left:0; right:0; top:290px; text-align:center; font-size:24px; color:#5f6368">Make your web pages fast on all devices</div>
    <div class="abs" style="left:190px; top:390px; width:720px; height:84px; border:2px solid #1a73e8; border-radius:10px; background:#fff; font-size:30px; line-height:80px; padding-left:30px; color:#202124">https://your-site.com<span style="display:inline-block; width:3px; height:36px; background:#202124; vertical-align:-6px; margin-left:4px"></span></div>
    <div class="abs" style="left:930px; top:390px; width:170px; height:84px; border-radius:10px; background:#1a73e8; color:#fff; font-size:28px; line-height:84px; text-align:center">Analyze</div></div>`, '#fff');
  onScreen(ui, 1280, 796, Q); window.Q2 = Q; }

/* ============ 3 — read LCP ============ */
stepHead(3, '٢', 'اقرأ رقم <bdi class="lat g" style="font-size:58px">LCP</bdi>', 'الوقت لين يبان أكبر شي<br>بالصفحة. شوف لونه:');
{ const Q = device('gen/p2_phone.png', 896, PHONE_Q, S(3, -40), 380, 760, 5);
  const row = (k, name, val, col, shape) => `<div class="abs" style="left:26px; right:26px; top:${520 + k * 92}px; height:80px; border-bottom:1px solid #e8eaed">
     <div class="abs" style="left:0; top:14px; width:18px; height:18px; ${shape === 'tri' ? `width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:18px solid ${col}` : `background:${col}; border-radius:${shape === 'dot' ? '50%' : '3px'}`}"></div>
     <div class="abs" style="left:32px; top:6px; font-size:19px; color:#3c4043">${name}</div>
     <div class="abs" style="left:32px; top:36px; font-size:30px; font-weight:600; color:${col}">${val}</div></div>`;
  const ui = screen(430, 940, `<div class="ui">
    <div class="abs" style="left:0; right:0; top:60px; display:flex; justify-content:center; gap:40px; font-size:20px; color:#5f6368"><span style="color:#1a73e8; border-bottom:3px solid #1a73e8; padding-bottom:8px">Mobile</span><span>Desktop</span></div>
    <div class="abs" style="left:135px; top:140px; width:160px; height:160px; border-radius:50%; background:conic-gradient(#e8710a 0 38%, #fce8d4 38% 100%)"></div>
    <div class="abs" style="left:147px; top:152px; width:136px; height:136px; border-radius:50%; background:#fff; color:#c5221f; font-size:56px; text-align:center; line-height:136px; color:#e8710a">38</div>
    <div class="abs" style="left:0; right:0; top:318px; text-align:center; font-size:22px; color:#202124">Performance</div>
    <div class="abs" style="left:26px; top:460px; font-size:20px; letter-spacing:1px; color:#5f6368">METRICS</div>
    ${row(0, 'First Contentful Paint', '3.1 s', '#e8710a', 'sq')}
    ${row(1, 'Largest Contentful Paint', '7.4 s', '#d93025', 'tri')}
    ${row(2, 'Speed Index', '6.0 s', '#d93025', 'tri')}
    ${row(3, 'Cumulative Layout Shift', '0.02', '#188038', 'dot')}</div>`, '#fff');
  ui.style.borderRadius = '44px'; onScreen(ui, 430, 940, Q); window.Q3 = Q; }
// legend: colour meanings
for (const [k, col, txt] of [[0, '#188038', 'أخضر: تمام'], [1, '#e8710a', 'برتقالي: انتبه'], [2, '#d93025', 'أحمر: مشكلة']]) {
  el(`<div class="abs" style="left:auto; right:${PAGE_W - S(3, 1000)}px; top:${560 + k * 110}px; display:flex; gap:20px; align-items:center; font-size:52px; white-space:nowrap"><span style="width:34px; height:34px; border-radius:50%; background:${col}; box-shadow:0 0 18px ${col}"></span>${txt}</div>`, 30);
}
el(`<div class="chip mute" style="left:${S(3, 640)}px; top:930px; font-size:30px; transform:rotate(-3deg)">الأرقام بالشاشة مثال</div>`, 31);

/* ============ 4 — image sizes ============ */
stepHead(4, '٣', 'شيّك أحجام الصور', 'كليك يمين ← <bdi class="lat" style="color:#fff; font-size:32px">Inspect → Network → Img</bdi><br>ورتّبها بالحجم.');
{ const Q = device('gen/p3_laptop_side.png', 896, SIDE_Q, S(4, 130), -150, 940, 5);
  const rows = [['hero-banner.jpg', '4.8 MB', 1], ['gallery-01.jpg', '3.6 MB', 1], ['gallery-02.jpg', '3.2 MB', 1], ['team-photo.png', '2.9 MB', 1], ['logo.svg', '6 KB', 0], ['icon-cart.svg', '2 KB', 0]];
  const ui = screen(1280, 796, `<div class="ui" style="font-size:28px">
    <div class="abs" style="left:0; right:0; top:0; height:56px; background:#292a2d; border-bottom:1px solid #3c4043; color:#9aa0a6; display:flex; gap:34px; padding:14px 26px">
      <span>Elements</span><span>Console</span><span style="color:#8ab4f8; border-bottom:3px solid #8ab4f8">Network</span><span>Performance</span></div>
    <div class="abs" style="left:0; right:0; top:56px; height:52px; background:#202124; color:#9aa0a6; display:flex; gap:22px; padding:10px 26px; font-size:22px">
      <span>All</span><span>Fetch/XHR</span><span>JS</span><span>CSS</span><span style="background:#394457; color:#fff; padding:0 12px; border-radius:6px">Img</span><span>Font</span></div>
    <div class="abs" style="left:0; right:0; top:108px; height:50px; background:#292a2d; color:#9aa0a6; padding:12px 26px; font-size:22px"><span>Name</span><span class="abs" style="left:820px; top:12px">Size &#9660;</span></div>
    ${rows.map(([n, s, bad], k) => `<div class="abs" style="left:0; right:0; top:${158 + k * 62}px; height:62px; background:${k % 2 ? '#202124' : '#242528'}; color:#e8eaed; padding:16px 26px">${n}<span class="abs" style="left:820px; top:16px; color:${bad ? '#f28b82' : '#e8eaed'}; font-weight:${bad ? 600 : 400}">${s}</span></div>`).join('')}
    <div class="abs" style="left:0; right:0; top:530px; bottom:0; background:#202124"></div></div>`, '#202124');
  onScreen(ui, 1280, 796, Q); window.Q4 = Q; }
ct(4, 920, 'صورة وزنها <span class="g">بالميجا</span>؟', 62);
ct(4, 1000, 'هذي غالبًا اللي مثقّلة موقعك.', 44, '', 'mute');
el(`<div class="chip mute" style="left:${S(4, 120)}px; top:400px; font-size:30px; transform:rotate(-3deg)">مثال</div>`, 31);

/* ============ 5 — mobile data ============ */
stepHead(5, '٤', 'جرّبه على بيانات الجوال', 'طفّ الواي فاي، افتح موقعك<br>وعدّ بصوت عالي.');
{ const Q = device('gen/p2_phone.png', 896, PHONE_Q, S(5, 340), 300, 740, 5);
  const ui = screen(430, 940, `
    <div class="abs ui" style="left:0; right:0; top:0; height:54px; background:#fff; font-size:20px; font-weight:600; color:#121416">
      <span class="abs" style="left:38px; top:16px">9:41</span>
      <span class="abs" style="right:40px; top:16px; display:flex; gap:8px; align-items:center">
        <span style="display:flex; gap:3px; align-items:flex-end"><i style="width:4px;height:6px;background:#121416"></i><i style="width:4px;height:9px;background:#121416"></i><i style="width:4px;height:12px;background:#c9ccd0"></i><i style="width:4px;height:15px;background:#c9ccd0"></i></span>4G
        <span style="width:30px; height:14px; border:2px solid #121416; border-radius:4px; position:relative"><i style="position:absolute; left:1px; top:1px; bottom:1px; width:60%; background:#121416"></i></span></span></div>
    <div class="abs" style="left:20px; right:20px; top:60px; height:44px; border-radius:12px; background:#eceef0; font-family:Plex; font-size:19px; line-height:44px; text-align:center; color:#5f6368; direction:ltr">your-site.com</div>
    <div class="abs" style="left:20px; top:112px; height:6px; width:28%; background:#1a73e8; border-radius:3px"></div>
    <div class="abs" style="left:150px; top:330px; width:130px; height:130px; border-radius:50%; border:14px solid #d6d9dc; border-top-color:#121416"></div>`, '#F4F5F6');
  ui.style.borderRadius = '44px'; onScreen(ui, 430, 940, Q); window.Q5 = Q; }
for (const [k, n, rot] of [[0, '١…', -6], [1, '٢…', 4], [2, '٣…', -3]])
  el(`<div class="abs" style="left:${S(5, 110)}px; top:${440 + k * 120}px; font-size:${90 + k * 16}px; line-height:1; font-weight:700; color:${k == 2 ? 'var(--g)' : '#fff'}; transform:rotate(${rot}deg); ${k == 2 ? 'text-shadow:0 0 40px rgba(0,219,51,.5)' : ''}">${n}</div>`, 30);
el(`<div class="abs" style="left:auto; right:${PAGE_W - S(5, 560)}px; top:850px; font-size:44px; line-height:1.3; font-weight:700; white-space:nowrap; text-align:right">فوق <span class="g">٣ ثواني</span>؟<br><span class="g">٥٣٪</span> من زوار<br>الجوال يطلعون.</div>`, 30);
el(`<div class="abs lat" style="left:${S(5, 90)}px; top:1056px; font-size:19px; color:#8d9195; direction:ltr; white-space:nowrap">Source: Google, The Need for Mobile Speed (2016)</div>`, 30);

/* ============ 6 — CTA ============ */
ct(6, 160, 'كثير خطوات؟', 64, '', 'mute');
ct(6, 250, 'خلّنا نسويها عنك.', 84);
ct(6, 400, 'اكتب', 70);
ct(6, 490, 'انطباع', 220, 'line-height:1; color:var(--g); text-shadow:0 0 60px rgba(0,219,51,.45)');
ct(6, 800, 'بالتعليقات، ونرسل لك', 52);
ct(6, 872, '<span class="pill">تقييم مجاني لموقعك</span>', 56);
el(`<img class="abs" src="gen/p4_keyboard.png" style="left:${S(6, 0)}px; top:60px; width:1080px; opacity:.9; -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 50%, #000 80%, transparent 96%)">`, 3);
el(`<div class="chip" style="left:${S(6, 250)}px; top:1040px; display:flex; gap:14px; align-items:center; font-size:38px">${SAVE_ICON}احفظ الخطوات عشان ترجع لها</div>`, 31);

document.fonts.ready.then(() => {
  fitLines('.t', 900); fitLines('.fit', 700);
  const C = [...document.querySelectorAll('.t')];
  // slide 2: circle the URL field
  { const [a, b, c, d] = window.Q2, sx = (b[0] - a[0]) / 1280, sy = (d[1] - a[1]) / 796;
    ring({ left: a[0] + 190 * sx, right: a[0] + 1100 * sx, top: a[1] + 390 * sy, bottom: a[1] + 474 * sy, width: 910 * sx, height: 84 * sy }, 26, 30);
    cursor(a[0] + 1010 * sx, a[1] + 450 * sy); }
  // slide 3: circle the LCP row + arrow from legend
  { const [a, b, c, d] = window.Q3, sx = (b[0] - a[0]) / 430, sy = (d[1] - a[1]) / 940;
    const r = { left: a[0] + 20 * sx, right: a[0] + 410 * sx, top: a[1] + 612 * sy, bottom: a[1] + 692 * sy }; r.width = r.right - r.left; r.height = r.bottom - r.top;
    ring(r, 30, 26);
    P(`M${S(3, 640)},790 C ${S(3, 600)},770 ${r.right + 80},${r.top - 40} ${r.right + 30},${r.top + 10}`); arrowHead(r.right + 30, r.top + 12, 130); }
  // slide 4: bracket the heavy rows
  { const [a, b, c, d] = window.Q4;
    const sx = (b[0] - a[0]) / 1280, sy = (d[1] - a[1]) / 796, lift = (b[1] - a[1]) / 1280;
    const map = (x, y) => { const u = x / 1280, v = y / 796; return [(1-u)*(1-v)*a[0] + u*(1-v)*b[0] + u*v*c[0] + (1-u)*v*d[0], (1-u)*(1-v)*a[1] + u*(1-v)*b[1] + u*v*c[1] + (1-u)*v*d[1]]; };
    const p0 = map(990, 168), p1 = map(1050, 290), p2 = map(990, 404);
    P(`M${p0[0]},${p0[1]} Q ${p1[0] + 30},${p0[1] + 20} ${p1[0]},${p1[1]} Q ${p1[0] + 30},${p2[1] - 20} ${p2[0]},${p2[1]}`);
    P(`M${p1[0] + 10},${p1[1]} C ${p1[0] + 80},${p1[1] + 30} ${S(4, 930)},${p1[1] + 40} ${S(4, 960)},${p1[1] + 110}`);
    el(`<div class="chip" style="left:${S(4, 800)}px; top:${p1[1] + 120}px; transform:rotate(5deg)">ثقيلة!</div>`, 31); }
  // slide 6: circle انطباع
  { const f = C.find(n => n.textContent === 'انطباع').getBoundingClientRect(); ring(f, 110, 30, ''); }
  document.body.dataset.ready = 1;
});
</script>
