<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../_kit/base.css">
<style>
html,body{width:8640px}
.k{position:absolute;left:80px;font-weight:600;font-size:26px;letter-spacing:.14em;color:var(--g)}
.n{position:absolute;right:60px;top:120px;font-weight:700;font-size:330px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(240,241,242,.16)}
.h{position:absolute;left:80px;right:80px;font-weight:700;line-height:1.08;white-space:nowrap}
.d{position:absolute;left:80px;width:880px;font-weight:400;font-size:38px;line-height:1.45;color:rgba(240,241,242,.78)}
.ap{position:absolute;left:80px;right:80px;border:2px solid rgba(0,219,51,.55);border-radius:26px;background:rgba(0,219,51,.06);padding:30px 36px 34px 120px}
.ap .bx{position:absolute;left:36px;top:34px;width:56px;height:56px;border-radius:14px;background:var(--g)}
.ap .bx svg{width:56px;height:56px}
.ap .l{font-weight:600;font-size:24px;letter-spacing:.14em;color:var(--g)}
.ap .v{font-weight:700;font-size:48px;line-height:1.25;margin-top:6px}
.row{position:absolute;left:180px;right:80px;height:96px;border-bottom:1px solid rgba(240,241,242,.14);display:flex;align-items:center;gap:20px;font-size:30px}
.row b{font-weight:700;color:var(--g);width:50px}
.row .s{font-weight:700;width:300px;white-space:nowrap;font-size:30px}
.row .t{font-weight:400;color:rgba(240,241,242,.8)}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#121416;border:6px solid var(--g);box-shadow:0 0 40px rgba(0,219,51,.7);z-index:20}
</style></head><body>
<div class="pg" style="left:0;background:#0b0c0d">
  <div class="bg" style="inset:0;background-image:url(gen/compass.png);background-size:cover;background-position:50% 100%"></div>
  <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(11,12,13,.75) 0,rgba(11,12,13,.2) 45%,rgba(11,12,13,0) 70%)"></div>
  <div class="h" style="top:170px;font-size:70px;font-weight:600">Most software projects<br>fail at</div>
  <div class="h g" style="top:330px;font-size:190px;text-shadow:0 0 60px rgba(0,219,51,.35)">step one.</div>
  <div class="h" style="top:560px;font-size:48px;font-weight:500;color:rgba(240,241,242,.85)">Nobody defined the goal.</div>
</div>
<script>
const steps=[
 ['Understand','We pin down the goal, the users and what success looks like, before anyone draws a screen.','The written goal and scope'],
 ['Quote and timeline','Scope, price and timeline are fixed in the contract. No open-ended estimates.','Contract: scope, price, dates'],
 ['Design','You see the key screens and flows before a line of code is written.','The designs, screen by screen'],
 ['Build and test','We build in stages, and test every stage before it reaches you.','Each milestone, on a test link'],
 ['Launch','Domain, hosting, analytics and final checks. Then we go live.','The go-live date'],
 ['Support','After launch we stay on for fixes and updates.','The support plan'],
];
steps.forEach(([t,d,a],i)=>{
  const L=(i+1)*1080, p=document.createElement('div');p.className='pg';p.style.left=L+'px';p.style.background='#0e1011';
  p.innerHTML=`<div class="glow" style="left:-160px;top:180px;width:560px;height:360px;opacity:.55"></div>
  <div class="n">0${i+1}</div>
  <div class="k" style="top:200px">STEP 0${i+1} / 06</div>
  <div class="h" style="top:330px;font-size:100px" data-max="920">${t}</div>
  <div class="d" style="top:470px;width:920px">${d}</div><div class="a" style="left:158px;top:${i%2?790:830}px;width:4px;height:${i%2?190:150}px;background:linear-gradient(180deg,#00DB33,rgba(0,219,51,.25))"></div>
  <div class="ap" style="top:980px"><div class="bx"><svg viewBox="0 0 56 56"><path d="M15 29l9 9 17-19" fill="none" stroke="#121416" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="l">YOU APPROVE</div><div class="v">${a}</div></div>`;
  document.body.appendChild(p);
});
// close
const C=7*1080, c=document.createElement('div');c.className='pg';c.style.left=C+'px';c.style.background='#0e1011';
c.innerHTML=`<div class="k" style="top:250px;left:180px">THE FINISH LINE</div>
<div class="h" style="top:320px;left:180px;font-size:72px">What you sign off,<br><span class="g">step by step.</span></div>`+
steps.map(([t,d,a],i)=>`<div class="row" style="top:${520+i*90}px;height:90px"><b>0${i+1}</b><span class="s">${t}</span><span class="t">${a}</span></div>`).join('')+
`<div class="a" style="left:180px;right:80px;top:1090px;font-size:34px;font-weight:500;line-height:1.4">Comment <span style="background:var(--g);color:#121416;padding:0 14px 4px;border-radius:10px;font-weight:700">review</span> and we'll send a first-impression review of your site.</div>`;
document.body.appendChild(c);
// the route: one green line from the compass through every step to the finish
const NS='http://www.w3.org/2000/svg', sv=document.createElementNS(NS,'svg');
sv.setAttribute('width',8640);sv.setAttribute('height',1350);sv.style.cssText='position:absolute;left:0;top:0;z-index:15;overflow:visible';
const pts=[[540,1010]];for(let i=1;i<=6;i++)pts.push([i*1080+160,i%2?760:800]);pts.push([7*1080+110,265]);
let d=`M${pts[0][0]},${pts[0][1]} C 760,1000 900,800 ${pts[1][0]},${pts[1][1]}`;
for(let i=1;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1];d+= i<pts.length-2 ? ` C ${x0+420},${y0-120} ${x1-420},${y1+120} ${x1},${y1}` : ` C ${x0+700},${y0+40} ${x1-60},${y0} ${x1},${y1}`}
sv.innerHTML=`<defs><filter id="gl"><feGaussianBlur stdDeviation="8"/></filter></defs><path d="${d}" fill="none" stroke="#00DB33" stroke-width="14" opacity=".5" filter="url(#gl)"/><path d="${d}" fill="none" stroke="#00DB33" stroke-width="6" stroke-linecap="round"/>`;
document.body.appendChild(sv);
pts.slice(1,7).forEach(([x,y])=>{const n=document.createElement('div');n.className='node';n.style.left=x+'px';n.style.top=y+'px';document.body.appendChild(n)});
// finish flag
const f=document.createElement('div');f.className='a';f.style.cssText=`left:${7*1080+110-34}px;top:${265-34}px;width:68px;height:68px;border-radius:50%;background:var(--g);box-shadow:0 0 50px rgba(0,219,51,.8);z-index:20`;f.innerHTML='<svg viewBox="0 0 68 68"><path d="M20 35l10 10 19-21" fill="none" stroke="#121416" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';document.body.appendChild(f);
</script><script src="../_kit/kit.js"></script>
<script>frame(8);fit('.h',920)</script>
</body></html>
