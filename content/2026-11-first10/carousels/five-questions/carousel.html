<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../_kit/base.css">
<style>
html,body{width:7560px}
.pg{direction:rtl}
.h{position:absolute;right:80px;left:80px;font-weight:700;line-height:1.15;text-align:right;white-space:nowrap}
.zoom{position:absolute;inset:-40px;background:url(gen/contract.png) no-repeat;filter:brightness(.42) blur(3px)}
.slip{position:absolute;right:80px;left:80px;top:250px;background:#F0F1F2;color:#121416;border-radius:6px;padding:46px 56px 58px;box-shadow:0 30px 60px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.2)}
.slip .no{font-weight:600;font-size:30px;color:#0a7a2a}
.slip .q{font-weight:700;font-size:74px;line-height:1.3;margin-top:10px}
.hl{background:linear-gradient(180deg,transparent 52%,rgba(0,219,51,.75) 52%,rgba(0,219,51,.75) 92%,transparent 92%);padding:0 6px}
.slip .ln{height:14px;border-radius:7px;background:rgba(18,20,22,.12);margin-top:22px}
.tab{position:absolute;right:0;width:74px;height:120px;background:var(--g);color:#121416;border-radius:16px 0 0 16px;font-weight:700;font-size:58px;display:flex;align-items:center;justify-content:center;padding-bottom:8px;z-index:30;box-shadow:0 0 40px rgba(0,219,51,.5)}
.why{position:absolute;right:80px;left:80px;text-align:right}
.why .k{font-weight:700;font-size:40px;color:var(--g)}
.why .t{font-weight:500;font-size:50px;line-height:1.55;margin-top:10px}
.tick{display:flex;gap:22px;align-items:flex-start;font-weight:600;font-size:40px;line-height:1.45;margin-top:26px}
.tick i{flex:none;width:46px;height:46px;border-radius:12px;background:var(--g);margin-top:8px;display:flex}
.pill{display:inline-block;background:var(--g);color:#121416;border-radius:12px;padding:0 16px 6px;font-weight:700}
</style></head><body>
<div class="pg" style="left:0" id="p1">
  <div class="bg" style="inset:0;background-image:url(gen/contract.png);background-size:cover;background-position:50% 100%"></div>
  <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(11,12,13,.85) 0,rgba(11,12,13,.35) 48%,rgba(11,12,13,0) 70%)"></div>
  <div class="h g" style="top:150px;font-size:230px;line-height:1.1;text-shadow:0 0 70px rgba(0,219,51,.35)">٥ أسئلة</div>
  <div class="h" style="top:410px;font-size:112px">قبل ما توقع</div>
  <div class="h" style="top:560px;font-size:52px;font-weight:500;color:rgba(240,241,242,.85)">مع أي شركة برمجة</div>
  <svg class="a" width="1080" height="1350" style="left:0;top:0;z-index:20;overflow:visible"><defs><filter id="r1"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter></defs>
   <ellipse cx="425" cy="862" rx="270" ry="105" transform="rotate(-15 425 862)" fill="none" stroke="#00DB33" stroke-width="9" stroke-linecap="round" filter="url(#r1)" stroke-dasharray="1500 120"/>
  </svg>
  <div class="a" style="left:120px;top:1010px;transform:rotate(-4deg);background:#F0F1F2;color:#121416;font-weight:700;font-size:38px;padding:4px 20px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:25">قبل هذا التوقيع</div>
  <div class="a" style="left:80px;bottom:150px;font-weight:600;font-size:30px;color:rgba(240,241,242,.8);border:2px solid rgba(240,241,242,.35);border-radius:30px;padding:6px 26px 12px;z-index:40">اسحب ←</div>
</div>
<script>
const Q=[
 ['وش بالضبط','اللي بيتسلم؟','بالضبط','لو النطاق مو مكتوب بند بند، أي طلب جديد يصير خلاف أو فاتورة زيادة.'],
 ['السعر ثابت','ولا ممكن يزيد؟','ثابت','السعر المفتوح يكبر مع المشروع. اطلب سعر نهائي مربوط بنطاق مكتوب.'],
 ['متى التسليم؟','ووش يصير لو تأخروا؟','التسليم','موعد بدون مراحل ما أحد يتحاسب عليه. اطلب جدول بمراحل وتواريخ.'],
 ['مين يملك الكود','والمحتوى والحسابات؟','يملك','لو الدومين والاستضافة والحسابات مو باسمك، بتظل مربوط بالشركة حتى لو تبي تطلع منها.'],
 ['وش يصير','بعد الإطلاق؟','بعد','كل موقع يحتاج تحديثات وإصلاحات. اسأل: مين يدعمك، وكم المدة، وبكم؟'],
];
const AR='٠١٢٣٤٥٦٧٨٩', ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const pans=['10% 20%','85% 35%','30% 70%','75% 85%','50% 55%'];
Q.forEach(([a,b,hl,why],i)=>{
  const p=document.createElement('div');p.className='pg';p.style.left=(i+1)*1080+'px';
  const mark=s=>s.replace(hl,`<span class="hl">${hl}</span>`);
  p.innerHTML=`<div class="zoom" style="background-size:220%;background-position:${pans[i]}"></div>
  <div class="a" style="inset:0;background:radial-gradient(ellipse at 70% 30%,rgba(0,219,51,.10),rgba(0,0,0,0) 60%)"></div>
  <div class="tab" style="top:${300+i*0}px">${ar(i+1)}</div>
  <div class="slip" style="transform:rotate(${i%2?1.2:-1.2}deg)">
    <div class="no">السؤال ${ar(i+1)} من ٥</div>
    <div class="q">${mark(a)}<br>${mark(b)}</div>
    <div class="ln" style="width:92%"></div><div class="ln" style="width:70%"></div>
  </div>
  <div class="why" style="top:790px"><div class="k">ليش مهم؟</div><div class="t">${why}</div></div>`;
  document.body.appendChild(p);
});
const c=document.createElement('div');c.className='pg';c.style.left='6480px';
c.innerHTML=`<div class="bg" style="inset:0;background-image:url(gen/contract.png);background-size:cover;background-position:50% 100%"></div>
<div class="a" style="inset:0;background:linear-gradient(180deg,rgba(11,12,13,.95) 0,rgba(11,12,13,.88) 46%,rgba(11,12,13,.15) 64%,rgba(11,12,13,0) 75%,rgba(11,12,13,.7) 100%)"></div>
<div class="h" style="top:150px;font-size:92px">وكيف <span class="g">نجاوب</span> احنا؟</div>
<div class="a" style="right:80px;left:80px;top:290px">
 <div class="tick"><i></i><span>النطاق والسعر والموعد <span class="g">ثابتة في العقد</span>.</span></div>
 <div class="tick"><i></i><span>٦ خطوات: نفهم ← عرض سعر وجدول ← تصميم ← تطوير واختبار ← إطلاق ← دعم.</span></div>
 <div class="tick"><i></i><span>مين يملك إيش، ومتى يتسلم، <span class="g">مكتوب من البداية</span>.</span></div>
</div>
<svg class="a" width="1080" height="1350" style="left:0;top:0;z-index:20;overflow:visible"><defs><filter id="gs"><feGaussianBlur stdDeviation="5"/></filter></defs>
 <g transform="rotate(-15 423 861)"><path d="M285 880 C 300 820 330 820 322 866 C 316 900 345 845 372 850 C 392 854 380 885 405 875 C 430 865 440 838 462 850 C 478 860 470 884 500 872 C 525 862 545 850 575 856" fill="none" stroke="#00DB33" stroke-width="12" opacity=".6" filter="url(#gs)"/>
 <path d="M285 880 C 300 820 330 820 322 866 C 316 900 345 845 372 850 C 392 854 380 885 405 875 C 430 865 440 838 462 850 C 478 860 470 884 500 872 C 525 862 545 850 575 856" fill="none" stroke="#00DB33" stroke-width="6" stroke-linecap="round"/></g>
</svg>
<div class="a" style="left:660px;top:740px;transform:rotate(-6deg);border:4px solid var(--g);color:var(--g);border-radius:12px;font-weight:700;font-size:34px;padding:2px 18px 10px;background:rgba(11,12,13,.55);z-index:25">مكتوب في العقد</div>
<div class="a" style="right:80px;left:80px;top:1030px;font-weight:600;font-size:38px;line-height:1.6;text-align:right;z-index:30">احفظ البوست لتوقيعك الجاي.<br>واكتب <span class="pill">انطباع</span> بالتعليقات ونرسل لك رأينا في موقعك.</div>`;
document.body.appendChild(c);
document.querySelectorAll('.tick i').forEach(n=>n.innerHTML='<svg viewBox="0 0 46 46" width="46" height="46"><path d="M12 24l8 8 14-16" fill="none" stroke="#121416" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
</script><script src="../_kit/kit.js"></script>
<script>frame(7);fit('.h',920)</script>
</body></html>
